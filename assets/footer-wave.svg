<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 90" width="100%" height="90">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#334480" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
  </defs>
  
  <!-- Upward Waving Background -->
  <path d="M0,90 L0,30 Q100,0 200,30 T400,30 T600,30 T800,30 T1000,30 T1200,30 T1400,30 T1600,30 L1600,90 Z" fill="url(#grad)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="12s" repeatCount="indefinite" />
  </path>
</svg>
