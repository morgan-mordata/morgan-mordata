<svg xmlns="http://www.w3.org/2000/svg" width="460" height="118" viewBox="0 0 460 118">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1222"/>
      <stop offset="55%" stop-color="#070A13"/>
      <stop offset="100%" stop-color="#04060B"/>
    </linearGradient>

    <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8DA2FF" stop-opacity="0.82"/>
      <stop offset="50%" stop-color="#8DA2FF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8DA2FF" stop-opacity="0.62"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8DA2FF" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#334480" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#05070D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="vDivider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8DA2FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8DA2FF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8DA2FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="progFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334480"/>
      <stop offset="100%" stop-color="#8DA2FF"/>
    </linearGradient>

    <clipPath id="cardClip">
      <rect x="1" y="1" width="458" height="116" rx="17.5"/>
    </clipPath>
  </defs>

  <!-- Main Glass & Void Container -->
  <rect x="0.75" y="0.75" width="458.5" height="116.5" rx="18" fill="url(#cardBg)" stroke="url(#cardBorder)" stroke-width="1.2"/>

  <!-- Clipped Atmospheric Details -->
  <g clip-path="url(#cardClip)">
    <!-- Ambient Indigo Glow Behind Resonator -->
    <circle cx="62" cy="59" r="68" fill="url(#coreGlow)"/>

    <!-- Subtle Architectural Grid Hairlines -->
    <line x1="0" y1="22" x2="460" y2="22" stroke="#8DA2FF" stroke-opacity="0.045" stroke-width="1"/>
    <line x1="0" y1="94" x2="460" y2="94" stroke="#8DA2FF" stroke-opacity="0.045" stroke-width="1"/>
    <line x1="382" y1="0" x2="382" y2="118" stroke="#8DA2FF" stroke-opacity="0.055" stroke-width="1"/>

    <!-- Top Specular Glass Highlight -->
    <line x1="24" y1="1.5" x2="436" y2="1.5" stroke="#B8C7FF" stroke-opacity="0.38" stroke-width="1"/>
  </g>

  <!-- LEFT MODULE: Kinetic Orbital Resonator (cx=62, cy=59) -->
  <g>
    <!-- Outer Housing Bezel -->
    <circle cx="62" cy="59" r="40" fill="#060913" stroke="#8DA2FF" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Precision Chronograph Tick Ring -->
    <circle cx="62" cy="59" r="35.5" fill="none" stroke="#8DA2FF" stroke-opacity="0.32" stroke-width="1.4" stroke-dasharray="1.2 4.38"/>

    <!-- Outer Rotating Orbital Arc + Satellite -->
    <g>
      <circle cx="62" cy="59" r="28.5" fill="none" stroke="#8DA2FF" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="46 133"/>
      <circle cx="62" cy="59" r="28.5" fill="none" stroke="#8DA2FF" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="12 167" stroke-dashoffset="90"/>
      <circle cx="62" cy="30.5" r="2.3" fill="#E6ECFF"/>
      <animateTransform attributeName="transform" type="rotate" from="0 62 59" to="360 62 59" dur="14s" repeatCount="indefinite"/>
    </g>

    <!-- Inner Counter-Rotating Arc -->
    <g>
      <circle cx="62" cy="59" r="20.5" fill="none" stroke="#B8C7FF" stroke-opacity="0.8" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="30 99"/>
      <circle cx="62" cy="79.5" r="1.7" fill="#8DA2FF"/>
      <animateTransform attributeName="transform" type="rotate" from="360 62 59" to="0 62 59" dur="9s" repeatCount="indefinite"/>
    </g>

    <!-- Glass & Void Inspired Twin Crescent Core -->
    <g>
      <circle cx="62" cy="59" r="12.5" fill="#0C1326" stroke="#8DA2FF" stroke-opacity="0.45" stroke-width="0.9"/>
      <path d="M62 48.5 A10.5 10.5 0 0 1 71.5 63.5 A7.5 7.5 0 0 0 62 53 Z" fill="#8DA2FF" fill-opacity="0.85"/>
      <path d="M62 69.5 A10.5 10.5 0 0 1 52.5 54.5 A7.5 7.5 0 0 0 62 65 Z" fill="#8DA2FF" fill-opacity="0.85"/>
      <animateTransform attributeName="transform" type="rotate" from="0 62 59" to="360 62 59" dur="22s" repeatCount="indefinite"/>
    </g>

    <!-- Pulsing Frequency Core -->
    <circle cx="62" cy="59" r="2.6" fill="#E6ECFF">
      <animate attributeName="r" values="2.1;3.1;2.1" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75;1;0.75" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Vertical Glass Divider -->
  <line x1="118" y1="18" x2="118" y2="100" stroke="url(#vDivider)" stroke-width="1"/>

  <!-- CENTER MODULE: Telemetry, Title & Live Equalizer -->
  <g>
    <!-- Live Status Dot -->
    <circle cx="137" cy="27.5" r="2.6" fill="#8DA2FF">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Micro Header -->
    <text x="146" y="31" fill="#8DA2FF" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="9.5" font-weight="600" letter-spacing="1.4">SPOTIFY // FLOW FREQUENCY</text>

    <!-- Playlist Title -->
    <text x="134" y="56" fill="#F2F5FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="-0.2">Cognitive Yield</text>

    <!-- Subtitle -->
    <text x="134" y="74.5" fill="#95A5D8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400">Deep Focus · Flow State · Morgan Engle</text>

    <!-- 14-Bar Live Harmonic Equalizer -->
    <g fill="#8DA2FF">
      <rect x="134" y="90" width="2.2" height="8" rx="1.1"><animate attributeName="height" values="4;12;5;10;4" dur="1.1s" repeatCount="indefinite"/><animate attributeName="y" values="92;88;91.5;89;92" dur="1.1s" repeatCount="indefinite"/></rect>
      <rect x="140" y="88" width="2.2" height="12" rx="1.1"><animate attributeName="height" values="11;5;14;6;11" dur="0.95s" repeatCount="indefinite"/><animate attributeName="y" values="88.5;91.5;87;91;88.5" dur="0.95s" repeatCount="indefinite"/></rect>
      <rect x="146" y="86" width="2.2" height="16" rx="1.1"><animate attributeName="height" values="15;7;13;4;15" dur="1.25s" repeatCount="indefinite"/><animate attributeName="y" values="86.5;90.5;87.5;92;86.5" dur="1.25s" repeatCount="indefinite"/></rect>
      <rect x="152" y="89" width="2.2" height="10" rx="1.1"><animate attributeName="height" values="6;15;8;12;6" dur="1.05s" repeatCount="indefinite"/><animate attributeName="y" values="91;86.5;90;88;91" dur="1.05s" repeatCount="indefinite"/></rect>
      <rect x="158" y="87" width="2.2" height="14" rx="1.1"><animate attributeName="height" values="13;4;11;15;13" dur="1.35s" repeatCount="indefinite"/><animate attributeName="y" values="87.5;92;88.5;86.5;87.5" dur="1.35s" repeatCount="indefinite"/></rect>
      <rect x="164" y="90" width="2.2" height="8" rx="1.1"><animate attributeName="height" values="5;11;14;6;5" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="91.5;88.5;87;91;91.5" dur="0.9s" repeatCount="indefinite"/></rect>
      <rect x="170" y="86" width="2.2" height="16" rx="1.1"><animate attributeName="height" values="16;8;12;5;16" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="86;90;88;91.5;86" dur="1.2s" repeatCount="indefinite"/></rect>
      <rect x="176" y="88" width="2.2" height="12" rx="1.1"><animate attributeName="height" values="9;14;5;11;9" dur="1.15s" repeatCount="indefinite"/><animate attributeName="y" values="89.5;87;91.5;88.5;89.5" dur="1.15s" repeatCount="indefinite"/></rect>
      <rect x="182" y="89" width="2.2" height="10" rx="1.1"><animate attributeName="height" values="12;4;15;7;12" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="88;92;86.5;90.5;88" dur="1.0s" repeatCount="indefinite"/></rect>
      <rect x="188" y="87" width="2.2" height="14" rx="1.1"><animate attributeName="height" values="6;13;9;15;6" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="91;87.5;89.5;86.5;91" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="194" y="90" width="2.2" height="8" rx="1.1"><animate attributeName="height" values="10;5;13;7;10" dur="0.92s" repeatCount="indefinite"/><animate attributeName="y" values="89;91.5;87.5;90.5;89" dur="0.92s" repeatCount="indefinite"/></rect>
      <rect x="200" y="88" width="2.2" height="12" rx="1.1"><animate attributeName="height" values="4;12;7;14;4" dur="1.18s" repeatCount="indefinite"/><animate attributeName="y" values="92;88;90.5;87;92" dur="1.18s" repeatCount="indefinite"/></rect>
      <rect x="206" y="89" width="2.2" height="10" rx="1.1"><animate attributeName="height" values="11;6;14;5;11" dur="1.08s" repeatCount="indefinite"/><animate attributeName="y" values="88.5;91;87;91.5;88.5" dur="1.08s" repeatCount="indefinite"/></rect>
      <rect x="212" y="91" width="2.2" height="6" rx="1.1"><animate attributeName="height" values="5;10;4;8;5" dur="1.22s" repeatCount="indefinite"/><animate attributeName="y" values="91.5;89;92;90;91.5" dur="1.22s" repeatCount="indefinite"/></rect>
    </g>

    <!-- Scrubber Track & Playhead -->
    <rect x="228" y="93" width="134" height="2" rx="1" fill="#8DA2FF" fill-opacity="0.18"/>
    <rect x="228" y="93" width="84" height="2" rx="1" fill="url(#progFill)"/>
    <circle cx="312" cy="94" r="2.6" fill="#E6ECFF"/>
  </g>

  <!-- RIGHT MODULE: Glass Play Action Trigger (cx=421, cy=51) -->
  <g>
    <circle cx="421" cy="51" r="23" fill="none" stroke="#8DA2FF" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="421" cy="51" r="18.5" fill="#11182E" stroke="#8DA2FF" stroke-opacity="0.72" stroke-width="1.2"/>
    <polygon points="417.5,44.5 417.5,57.5 428.5,51" fill="#8DA2FF"/>
    <text x="421" y="91.5" text-anchor="middle" fill="#8DA2FF" fill-opacity="0.88" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="8.5" font-weight="600" letter-spacing="1.5">LISTEN</text>
  </g>
</svg>
