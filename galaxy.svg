        <path d="M 0,0 C -15,-55 20,-110 85,-135 C 165,-165 265,-95 295,20 C 325,145 245,275 115,315" fill="none" stroke="url(#armGradPurple)" stroke-width="10" stroke-linecap="round" opacity="0.34" />
