        <path d="M 0,0 C -55,15 -110,-20 -135,-85 C -165,-165 -95,-265 20,-295 C 145,-325 275,-245 315,-115" fill="none" stroke="url(#armGradPurple)" stroke-width="14" stroke-linecap="round" opacity="0.48" />
