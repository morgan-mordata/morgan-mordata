      <circle cx="0" cy="0" r="225" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.2" stroke-dasharray="4 9" />
      <circle cx="0" cy="0" r="315" fill="none" stroke="#c084fc" stroke-opacity="0.18" stroke-width="1.2" stroke-dasharray="3 11" />

