<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#171336" />
      <stop offset="48%" stop-color="#0b0e1c" />
      <stop offset="100%" stop-color="#05070e" />
    </radialGradient>

    <radialGradient id="nebulaPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.45" />
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#05070e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nebulaCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0ea5e9" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#05070e" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="24%" stop-color="#e9d5ff" stop-opacity="0.88" />
      <stop offset="52%" stop-color="#8b5cf6" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="armGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#38bdf8" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="armGradPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#c084fc" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <filter id="starGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softNebula" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" />
    </filter>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="896" height="436" rx="18" ry="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="900" height="440" fill="url(#spaceBg)" />

    <!-- Twinkling Background Stars -->
    <g fill="#e2e8f0">
      <circle cx="68" cy="56" r="1.2" opacity="0.7"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" repeatCount="indefinite" /></circle>
      <circle cx="155" cy="84" r="1" opacity="0.5" />
      <circle cx="235" cy="46" r="1.4" opacity="0.8"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.2s" repeatCount="indefinite" /></circle>
      <circle cx="345" cy="62" r="0.9" opacity="0.5" />
      <circle cx="525" cy="48" r="1.3" opacity="0.75"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.8s" repeatCount="indefinite" /></circle>
      <circle cx="655" cy="70" r="1" opacity="0.5" />
      <circle cx="790" cy="58" r="1.4" opacity="0.85"><animate attributeName="opacity" values="0.9;0.25;0.9" dur="3.7s" repeatCount="indefinite" /></circle>
      <circle cx="842" cy="116" r="1.1" opacity="0.55" />
      <circle cx="52" cy="175" r="1.2" opacity="0.6" />
      <circle cx="86" cy="318" r="1.1" opacity="0.5" />
      <circle cx="142" cy="382" r="1.3" opacity="0.75"><animate attributeName="opacity" values="0.25;0.85;0.25" dur="3.5s" repeatCount="indefinite" /></circle>
      <circle cx="280" cy="394" r="1" opacity="0.5" />
      <circle cx="615" cy="390" r="1.3" opacity="0.7"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite" /></circle>
      <circle cx="768" cy="374" r="1" opacity="0.55" />
      <circle cx="836" cy="322" r="1.4" opacity="0.8"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" repeatCount="indefinite" /></circle>
