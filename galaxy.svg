        <circle r="8.5" fill="#7dd3fc" fill-opacity="0.22" />
        <circle r="3.3" fill="#7dd3fc" filter="url(#starGlow)" />
        <rect x="-40" y="-21" width="80" height="14" rx="3" fill="#090d16" fill-opacity="0.82" />
        <text x="0" y="-11" text-anchor="middle" fill="#e0f2fe">Review-Hub</text>
